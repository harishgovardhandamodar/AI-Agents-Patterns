# AI Agent Patterns & Guardrails — dedicated Tailscale node deployment.
#
# Gives the dashboard its own machine on your tailnet with a stable HTTPS URL:
#
#     https://<TS_HOSTNAME>.<your-tailnet>.ts.net
#
# and also keeps it reachable on the LAN at http://<host>:5175.
#
# Usage:
#   1. cp .env.example .env      # then set TS_AUTHKEY (and optionally TS_HOSTNAME)
#   2. docker compose -f docker-compose.tailscale.yml up -d --build
#
# How it works: the `web` container shares the Tailscale container's network
# namespace (network_mode: service:tailscale), so `tailscale serve` can proxy
# to the app on 127.0.0.1:8080. This is the canonical Tailscale sidecar pattern.
#
# Requires HTTPS certificates to be enabled for your tailnet (admin console >
# DNS > HTTPS Certificates). If they aren't, switch tailscale/serve.json to
# plain HTTP on port 80 (see the comment at the top of that file).

name: ai-agent-patterns

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ai-agent-patterns-ts
    hostname: ${TS_HOSTNAME:-ai-agent-patterns}
    environment:
      # Fail fast with a clear message if the key is missing.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env — see .env.example}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"          # kernel networking (needs /dev/net/tun)
      TS_ACCEPT_DNS: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    ports:
      # LAN exposure. The app shares this namespace, so this reaches the app.
      - "0.0.0.0:${APP_PORT:-5175}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-patterns:latest
    container_name: ai-agent-patterns-web
    # Share the Tailscale container's network namespace so serve can reach us
    # on 127.0.0.1:8080.
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      PORT: "8080"
      FOX_LLM_URL: "${FOX_LLM_URL:-http://host.docker.internal:8210}"
      AXIOM_LLM_URL: "${AXIOM_LLM_URL:-http://100.101.3.115:8210}"
      LLM_MODEL: "${LLM_MODEL:-quai-qwen3.8-27b:latest}"
      LLM_CONNECT_TIMEOUT: "${LLM_CONNECT_TIMEOUT:-5}"
      LLM_READ_TIMEOUT: "${LLM_READ_TIMEOUT:-600}"
      LLM_FIRST_TOKEN_TIMEOUT: "${LLM_FIRST_TOKEN_TIMEOUT:-60}"
      LLM_STALL_TIMEOUT: "${LLM_STALL_TIMEOUT:-45}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tailscale-state:
